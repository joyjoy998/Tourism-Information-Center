<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Information</title>
    <script>
      async function searchByCity() {
        const city = document.getElementById("query").value.trim(); // Get and trim user input

        // Ensure input field is filled
        if (!city) {
          alert("Please enter a city name.");
          return;
        }

        // Create query parameters to send the city name
        const params = new URLSearchParams({ city: city });
        console.log("Query Parameters:", params.toString()); 

        try {
          const response = await fetch(
            `https://2hf6llpfb1.execute-api.ap-southeast-2.amazonaws.com/prod/viSearch?${params.toString()}`
          );

          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
 
          const data = await response.json();
          console.log(data);
  
        } catch (error) {
          console.error("Error fetching data:", error);
          alert("There was an error fetching the search results. Please try again.");
        }
      }

    
    </script>
  </head>
  <body>
    <div>
      <label for="query">City Search:</label>
      <input type="text" id="query" placeholder="Enter city name" />
    </div>
    <button onclick="searchByCity()">Search</button>

  </body>
</html>
