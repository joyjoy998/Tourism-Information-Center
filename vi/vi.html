<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Information</title>
    <script>
      async function search() {
        const query = document.getElementById("query").value; // Get user input

        const response = await fetch(
          `https://ldt2xaff42.execute-api.ap-southeast-2.amazonaws.com/prod/viSearch?name=${query}&state=${query}&city=${query}`
        );
        const data = await response.json();
        console.log(data);
        displayResults(data); // Display results
      }

      function displayResults(data) {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = ""; // Clear previous search results
        data.forEach((item) => {
          const div = document.createElement("div");
          div.innerHTML = `
            <h3>${item.Name}</h3>
            <p>City: ${item.City}</p>
            <p>State: ${item.State}</p>
            <p>Description: ${item.Description}</p>
            <img src="${item.Image}" alt="${item.Name}" width="200">
          `;
          resultsDiv.appendChild(div);
        });
      }
    </script>
  </head>
  <body>
    <input type="text" id="query" placeholder="search" />
    <button onclick="search()">Search</button>
    <div id="results"></div>
  </body>
</html>
